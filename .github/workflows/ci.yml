name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.2'
      - run: npm run verify
      - run: docker build -t interactive-evidence-presenter:test .
      - run: |
          docker run -d --rm -p 18080:8080 --name iep-smoke interactive-evidence-presenter:test
          for i in {1..20}; do curl -fsS http://127.0.0.1:18080/healthz && exit 0; sleep 1; done
          docker logs iep-smoke
          exit 1

  e2e-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.2'
      - name: Install pinned test dependency
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run reference Playwright suite
        run: npm run test:e2e
      - name: Build UAT evidence book
        if: always()
        run: npm run uat:report
      - name: Upload Playwright, UAT and OTEL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reference-report
          path: |
            playwright-report/
            test-results/
            uat-report/
          if-no-files-found: error
          retention-days: 90
